spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:pricing_management}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=${MYSQL_TIMEZONE:Asia/Shanghai}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

dubbo:
  registry:
    address: nacos://${NACOS_ADDRESS:}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
  config-center:
    address: nacos://${NACOS_ADDRESS:}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
  metadata-report:
    address: nacos://${NACOS_ADDRESS:}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}

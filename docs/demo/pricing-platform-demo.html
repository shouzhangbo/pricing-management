<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配送费定价管理平台 · 配置逻辑演示（教学用）</title>
<style>
  :root{
    --sb-w:216px; --brand:#2f6fed; --brand-d:#1d4ed8;
    --ink:#1f2329; --ink2:#4e5969; --ink3:#86909c;
    --line:#e5e6eb; --bg:#f2f3f5; --card:#fff;
    --ok:#00b42a; --warn:#ff7d00; --err:#f53f3f; --grey:#86909c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
  /* ---------- 布局：左导航 + 右工作台 ---------- */
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb-w);background:#17181c;color:#c9cdd4;
           display:flex;flex-direction:column;z-index:20}
  .main{margin-left:var(--sb-w);min-height:100vh;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:0 20px}
  .content{padding:16px 20px 28px;flex:1}
  /* ---------- 侧栏 ---------- */
  .logo{padding:16px 18px 14px;border-bottom:1px solid #292b31}
  .logo b{color:#fff;font-size:15px;letter-spacing:.5px;display:block}
  .logo span{font-size:11px;color:#6b7280}
  .nav{padding:8px 0;flex:1;overflow:auto}
  .nav-item{padding:10px 18px;cursor:pointer;font-size:13.5px;display:flex;align-items:center;gap:9px;
            border-left:3px solid transparent;user-select:none}
  .nav-item:hover{background:#21232a;color:#fff}
  .nav-item.on{background:#21232a;color:#fff;border-left-color:var(--brand)}
  .nav-item i{width:14px;text-align:center;font-style:normal;opacity:.75}
  .nav-group{padding:14px 18px 6px;font-size:11px;color:#6b7280;letter-spacing:.5px}
  .sb-foot{padding:10px 18px;border-top:1px solid #292b31;font-size:11px;color:#6b7280;line-height:1.7}
  /* ---------- 业务线（租户）切换条 ---------- */
  .tenant{display:flex;align-items:center;gap:6px;padding:12px 0 10px}
  .tenant>span{font-size:12px;color:var(--ink3);margin-right:6px;white-space:nowrap}
  .pill{padding:5px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;
        font-size:13px;color:var(--ink2);white-space:nowrap;user-select:none}
  .pill:hover{border-color:var(--brand);color:var(--brand)}
  .pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .pill em{font-style:normal;opacity:.7;font-size:11px;margin-left:4px}
  .bizline-bar{padding-left:18px;margin-left:6px;border-left:1px dashed var(--line);font-size:12px;color:var(--ink3);white-space:nowrap}
  /* ---------- 页签上方的场景下拉 ---------- */
  .scenerow{display:flex;align-items:center;gap:9px;padding:0 0 12px}
  .scenerow>span{font-size:12px;color:var(--ink3);white-space:nowrap}
  .scenerow select{min-width:190px;padding:6px 10px;font-size:13.5px}
  .scenerow .sc-cnt{font-size:12px;color:var(--ink3)}
  .scenerow .sc-cnt b{color:var(--ink2)}
  /* ---------- 页签 ---------- */
  .tabs{display:flex;gap:2px;margin-top:2px;border-bottom:1px solid var(--line)}
  .tab{padding:9px 22px;cursor:pointer;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent;user-select:none}
  .tab:hover{color:var(--brand)}
  .tab.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  /* ---------- 卡片 / 筛选 / 按钮 ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:14px;overflow:hidden}
  .card-hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card-hd h3{margin:0;font-size:14px}
  .card-bd{padding:14px 16px}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink3)}
  select,input[type=text],input[type=number],input[type=datetime-local],textarea{
    border:1px solid var(--line);border-radius:5px;padding:5px 8px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--brand)}
  textarea{width:100%;min-height:56px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
  .btn{border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 14px;font-size:13px;cursor:pointer;color:var(--ink2)}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn-p{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-p:hover{background:var(--brand-d);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .mini{border:none;background:none;color:var(--brand);cursor:pointer;font-size:13px;padding:0 6px}
  .mini:hover{text-decoration:underline}
  .mini:disabled{color:var(--ink3);cursor:not-allowed;text-decoration:none}
  .mini.danger{color:var(--err)}
  /* ---------- 表格 ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#fafafa;text-align:left;font-weight:600;color:var(--ink2);white-space:nowrap}
  th,td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:hover{background:#f7f8fa}
  td .sub{font-size:11.5px;color:var(--ink3)}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;border:1px solid;line-height:18px;white-space:nowrap}
  .tag.pub{color:var(--ok);border-color:#aee1b8;background:#f0faf2}
  .tag.draft{color:var(--warn);border-color:#ffcf99;background:#fff7e8}
  .tag.hist{color:var(--grey);border-color:#d4d7dd;background:#f7f8fa}
  .tag.off{color:var(--grey);border-color:#d4d7dd;background:#f7f8fa}
  .tag.in{color:var(--brand);border-color:#bcd3fb;background:#f0f5ff}
  .tag.notin{color:#7c3aed;border-color:#d5c3f5;background:#f7f2ff}
  .ver{font-size:11.5px;color:var(--ink2);background:#f2f3f5;border-radius:4px;padding:1px 6px}
  .empty{padding:40px;text-align:center;color:var(--ink3);font-size:13px}
  /* ---------- 教学提示条 ---------- */
  .note{margin-top:14px;background:#f0f5ff;border:1px solid #bcd3fb;border-left:3px solid var(--brand);
        border-radius:6px;padding:10px 14px;font-size:12.5px;color:#1d3a7a;line-height:1.9}
  .note b{color:#0e2a5f}
  .hint{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
  /* ---------- 弹窗 / 抽屉 / 浮层 ---------- */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:100}
  .modal{background:#fff;border-radius:10px;width:680px;max-width:94vw;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  .modal-hd{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-hd h3{margin:0;font-size:15px}
  .x{border:none;background:none;font-size:20px;color:var(--ink3);cursor:pointer;line-height:1}
  .x:hover{color:var(--ink)}
  .modal-bd{padding:16px 18px;overflow:auto}
  .modal-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .content-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;color:var(--ink2)}
  .content-row input{width:92px}
  .content-row .distance-end{width:104px}
  .content-row.distance-row{display:grid;grid-template-columns:68px auto 92px auto 68px auto 68px auto;gap:5px;flex-wrap:nowrap;white-space:nowrap}
  .content-row.time-row{display:grid;grid-template-columns:106px auto 106px auto 68px auto;gap:5px;flex-wrap:nowrap;white-space:nowrap}
  .content-row.distance-row input,.content-row.time-row input{width:100%;min-width:0}
  .field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:4px}
  .field label em{color:var(--err);font-style:normal}
  .field input,.field select{width:100%}
  .field.full{grid-column:1/-1}
  .err-box{background:#ffece8;border:1px solid #fdcdc5;color:#cb2724;border-radius:6px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.8}
  .drawer{position:fixed;right:0;top:0;bottom:0;width:620px;max-width:96vw;background:#fff;
          box-shadow:-6px 0 24px rgba(0,0,0,.12);z-index:110;display:flex;flex-direction:column}
  .drawer .modal-bd{padding:16px 18px}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13px;margin-bottom:14px}
  .kv dt{color:var(--ink3)}
  .kv dd{margin:0}
  .sec{font-size:13px;font-weight:600;margin:16px 0 8px;padding-left:8px;border-left:3px solid var(--brand)}
  .mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#f7f8fa;border:1px solid var(--line);
        border-radius:5px;padding:8px 10px;white-space:pre-wrap;word-break:break-all;color:var(--ink2)}
  /* 版本链时间轴 */
  .chain{position:relative;padding-left:14px;border-left:2px solid var(--line)}
  .chain-i{position:relative;padding:0 0 12px 12px;font-size:12.5px}
  .chain-i::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;
                   background:#fff;border:2px solid var(--grey)}
  .chain-i.now::before{border-color:var(--ok);background:var(--ok)}
  .chain-i.draft::before{border-color:var(--warn);background:var(--warn)}
  .chain-i small{color:var(--ink3)}
  /* toast */
  .toast-wrap{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{padding:9px 18px;border-radius:6px;font-size:13px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.18);max-width:70vw}
  .toast.ok{background:var(--ok)} .toast.err{background:var(--err)} .toast.warn{background:var(--warn)} .toast.info{background:#1f2329}
  /* 其他导航页 */
  .page-intro{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-top:14px}
  .page-intro h2{margin:0 0 6px;font-size:16px}
  .page-intro p{margin:0 0 10px;font-size:13px;color:var(--ink2)}
  .api-item{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px}
  .api-item code{font-size:12.5px;color:var(--brand-d);font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font-size:11.5px;background:#f2f3f5;border-radius:4px;padding:1px 7px;color:var(--ink2)}
  .hidden{display:none !important}
</style>
</head>
<body>

<!-- ============ 左侧导航栏 ============ -->
<aside class="sidebar">
  <div class="logo"><b>配送费定价管理平台</b><span>配置逻辑演示 · 教学用 Mock</span></div>
  <nav class="nav" id="nav"></nav>
  <div class="sb-foot">数据全部为演示假数据<br>口径以 docs/ 设计文档为准</div>
</aside>

<!-- ============ 右侧工作台 ============ -->
<div class="main">
  <!-- 工作台顶部：业务线（租户）切换 + 场景下拉 + 页签 -->
  <div class="topbar">
    <div class="tenant" id="tenant"></div>
    <div class="scenerow" id="scenerow"></div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<div id="overlay"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =====================================================================
   配送费定价管理平台 · 前端交互演示（单文件 / 无依赖 / 纯假数据）
   层级模型：业务线(租户) → 定价场景 → 费用组 → 费用 → 方案实例 → 维度绑定
   演示重点：时间区间版本化、双模板成对、维度互斥(I4)/区间不重叠(I1)冲突拦截
   ===================================================================== */

/* ------------------------------ 1. 静态字典 ------------------------------ */
// 业务线 = 租户口径：切换后所有数据按业务线隔离展示
const BIZ_LINES = [
  {code:'USER',     name:'用户配送费', owner:'C端定价运营组', desc:'用户下单时支付的配送费'},
  {code:'RIDER',    name:'骑手配送费', owner:'骑手结算运营组', desc:'平台向骑手结算的运费与补贴'},
  {code:'MERCHANT', name:'商家配送费', owner:'商家结算运营组', desc:'平台向商家收取或分摊的配送费'},
];

// 场景 → 费用组 → 费用（三级归属链，用于级联筛选与表单选项）
// 三条业务线下的定价场景均为：快送 / 专送 / 混合送（每个业务线一份独立的场景记录）
const SCENES = [
  {code:'U_KS', name:'快送',   biz:'USER',     factors:'BASE_FEE,WEIGHT,WEATHER,TIME_SLOT'},
  {code:'U_ZS', name:'专送',   biz:'USER',     factors:'BASE_FEE,DISTANCE,WEATHER'},
  {code:'U_HH', name:'混合送', biz:'USER',     factors:'BASE_FEE,DISTANCE,WEIGHT'},
  {code:'R_KS', name:'快送',   biz:'RIDER',    factors:'BASE_FEE,DISTANCE,WEATHER,TIME_SLOT'},
  {code:'R_ZS', name:'专送',   biz:'RIDER',    factors:'BASE_FEE,DISTANCE,WEATHER'},
  {code:'R_HH', name:'混合送', biz:'RIDER',    factors:'BASE_FEE,DISTANCE,WEIGHT'},
  {code:'M_KS', name:'快送',   biz:'MERCHANT', factors:'BASE_FEE,USER_LEVEL'},
  {code:'M_ZS', name:'专送',   biz:'MERCHANT', factors:'BASE_FEE,USER_LEVEL,DISTANCE'},
  {code:'M_HH', name:'混合送', biz:'MERCHANT', factors:'BASE_FEE,DISTANCE'},
];
const GROUPS = [
  {code:'FG_U_KS', name:'快送费用组',     scene:'U_KS'},
  {code:'FG_U_ZS', name:'专送费用组',     scene:'U_ZS'},
  {code:'FG_U_HH', name:'混合送费用组',   scene:'U_HH'},
  {code:'FG_R_KS', name:'骑手快送费组',   scene:'R_KS'},
  {code:'FG_R_ZS', name:'骑手专送费组',   scene:'R_ZS'},
  {code:'FG_R_HH', name:'骑手混合送费组', scene:'R_HH'},
  {code:'FG_M_KS', name:'商家快送费组',   scene:'M_KS'},
  {code:'FG_M_ZS', name:'商家专送费组',   scene:'M_ZS'},
  {code:'FG_M_HH', name:'商家混合送费组', scene:'M_HH'},
];
const FEES = [
  {code:'U_KS_DELIVERY', name:'快送配送费',    group:'FG_U_KS', order:1, required:true},
  {code:'U_KS_NIGHT',    name:'夜间配送费',    group:'FG_U_KS', order:2, required:false},
  {code:'U_KS_WEATHER',  name:'恶劣天气附加费', group:'FG_U_KS', order:3, required:false},
  {code:'U_ZS_DELIVERY', name:'专送配送费',    group:'FG_U_ZS', order:1, required:true},
  {code:'U_HH_DELIVERY', name:'混合送配送费',  group:'FG_U_HH', order:1, required:true},
  {code:'R_KS_BASE',     name:'骑手基础运费',  group:'FG_R_KS', order:1, required:true},
  {code:'R_KS_WEATHER',  name:'骑手天气补贴',  group:'FG_R_KS', order:2, required:false},
  {code:'R_ZS_BASE',     name:'专送基础运费',  group:'FG_R_ZS', order:1, required:true},
  {code:'R_HH_BASE',     name:'混合送基础运费', group:'FG_R_HH', order:1, required:true},
  {code:'M_KS_SHARE',    name:'快送费用分摊',  group:'FG_M_KS', order:1, required:true},
  {code:'M_ZS_SHARE',    name:'专送费用分摊',  group:'FG_M_ZS', order:1, required:true},
  {code:'M_HH_SHARE',    name:'混合送费用分摊', group:'FG_M_HH', order:1, required:true},
];

// 因子字典（平台级，场景 factor_scope 约束可用范围）
const FACTORS = [
  {code:'BASE_FEE',  name:'起步价',   type:'数值 NUMERIC',  rule:'> 0，两位小数'},
  {code:'WEIGHT',    name:'重量续重', type:'区间表 RANGE_TABLE', rule:'区间连续无缝、右开'},
  {code:'DISTANCE',  name:'距离',     type:'区间表 RANGE_TABLE', rule:'区间连续无缝'},
  {code:'WEATHER',   name:'天气系数', type:'枚举 ENUM',     rule:'SUN / RAIN / SNOW'},
  {code:'TIME_SLOT', name:'时段',     type:'枚举 ENUM',     rule:'NIGHT / DAY'},
  {code:'USER_LEVEL',name:'客户等级', type:'枚举 ENUM',     rule:'V1 / V2 / V3'},
];

// 模板库（CALC 计算模板 / DISPLAY 展示模板，版本不可变、成对绑定）
const TEMPLATES = [
  {code:'C_START_CONT', ver:'v3', type:'CALC',    name:'起步+续重', body:'BASE_FEE + ceil((WEIGHT-1)/1) * CONT_UNIT'},
  {code:'C_START_CONT', ver:'v2', type:'CALC',    name:'起步+续重', body:'BASE_FEE + ceil((WEIGHT-1)/1) * CONT_UNIT'},
  {code:'C_WEATHER',    ver:'v1', type:'CALC',    name:'天气系数',  body:'BASE_FEE * WEATHER_COEF'},
  {code:'C_DISTANCE',   ver:'v1', type:'CALC',    name:'起步+距离', body:'BASE_FEE + DISTANCE_KM * UNIT_PRICE'},
  {code:'C_DISCOUNT',   ver:'v1', type:'CALC',    name:'补贴直减',  body:'BASE_FEE - SUBSIDY'},
  {code:'C_FIXED_VALUE',ver:'v1', type:'CALC',    name:'固定值',    body:'BASE_FEE'},
  {code:'C_DISTANCE_STEP',ver:'v1',type:'CALC',   name:'距离步长',  body:'按距离区间和步长累加'},
  {code:'C_TIME_SURCHARGE',ver:'v1',type:'CALC',  name:'时间加价',  body:'按命中时段累加'},
  {code:'C_BASE_TIME',  ver:'v1', type:'CALC',    name:'基础配送费+时间配送费', body:'BASE_FEE + TIME_SURCHARGE'},
  {code:'D_TEXT',       ver:'v3', type:'DISPLAY', name:'标准文案',  body:'配送费 {total} 元：起步 {base} + 续重 {cont}'},
  {code:'D_TEXT',       ver:'v2', type:'DISPLAY', name:'标准文案',  body:'配送费 {total} 元'},
  {code:'D_WEATHER',    ver:'v1', type:'DISPLAY', name:'天气文案',  body:'恶劣天气加价 {add} 元'},
  {code:'D_DISTANCE',   ver:'v1', type:'DISPLAY', name:'距离文案',  body:'按距离计费 {total} 元'},
  {code:'D_DISCOUNT',   ver:'v1', type:'DISPLAY', name:'补贴文案',  body:'已补贴 {subsidy} 元，实付 {total} 元'},
];

// 维度字典（方案生效范围）
const DIM_CODES = [
  {id:1, code:'COUNTRY',       name:'国家',     candidates:['中国']},
  {id:2, code:'CITY',          name:'城市',     candidates:['上海','北京','广州','深圳','杭州','成都']},
  {id:3, code:'DELIVERY_ZONE', name:'配送区域', candidates:['G-001','G-002','G-003']},
  {id:4, code:'GRID',          name:'网格',     candidates:['G-001','G-002','G-003']},
  {id:5, code:'MERCHANT',      name:'商家分组', candidates:['KA组','SMB组']},
  {id:6, code:'USER_LEVEL',    name:'客户等级', candidates:['V1','V2','V3']},
  {id:7, code:'TIME_SLOT',     name:'时段',     candidates:['夜宵 21:00-06:00','日间 06:00-21:00']},
];

const DIMENSION_ITEMS = [
  {id:101, type:'COUNTRY', name:'中国'},
  {id:201, type:'CITY', name:'上海'}, {id:202, type:'CITY', name:'北京'}, {id:203, type:'CITY', name:'广州'},
  {id:204, type:'CITY', name:'深圳'}, {id:205, type:'CITY', name:'杭州'}, {id:206, type:'CITY', name:'成都'},
  {id:301, type:'DELIVERY_ZONE', name:'G-001'}, {id:302, type:'DELIVERY_ZONE', name:'G-002'}, {id:303, type:'DELIVERY_ZONE', name:'G-003'},
];

/* ------------------------------ 2. 演示数据 ------------------------------ */
/* 方案记录：id 即 schemeId；start/end 表达该记录的生效时间区间。 */
let schemes = [
  /* ---- 用户配送费 · 快送 ---- */
  {id:'S101', name:'基础配送费', biz:'USER', scene:'U_KS', group:'FG_U_KS', fee:'U_KS_DELIVERY',
   status:'PUBLISHED', start:'2026-07-01 00:00', end:'2026-09-30 23:59',
   calc:'C_FIXED_VALUE v1', display:'D_TEXT v3', factors:[['BASE_FEE','5 元']],
   editor:'王小明', approve:'李审批'},

/* ------------------------------ 7. 不变式校验：双模板 / I1 / I4 ------------------------------ */
// 某方案在某维度上的命中集合（合并该方案全部绑定行 + 可选的待保存行；未声明=全集）
function hitSet(schemeId, dimCode, excludeId, extra){
  const cand = (dimOf(dimCode).candidates||[]);
  const rows = bindings.filter(b=>b.schemeId===schemeId && b.dimCode===dimCode && b.id!==excludeId)
                       .concat(extra && extra.dimCode===dimCode ? [extra] : []);
  if(!rows.length) return new Set(cand);
  let cur = null;
  rows.forEach(r=>{
    let seg;
    if(r.match==='IN') seg = new Set(r.values);
    else { seg = new Set(cand); r.values.forEach(v=>seg.delete(v)); }              // 补集
    cur = (cur===null) ? seg : new Set([...cur].filter(v=>seg.has(v)));            // 多行取交
  });
  return cur || new Set();
}
const inter = (a,b)=>[...a].filter(v=>b.has(v));
// I4：与同一费用下其他已发布实例比对“维度相交 + 时间重叠”
function checkI4(schemeId, dimCode, excludeId, extra){
  const me = schemeOf(schemeId); if(!me) return [];
  const mine = hitSet(schemeId, dimCode, excludeId, extra);
  if(!mine.size) return [];
  const bad = [];
  schemes.filter(o=>o.id!==schemeId && o.fee===me.fee && o.status==='PUBLISHED').forEach(o=>{
    const common = inter(mine, hitSet(o.id, dimCode, null, null));
    if(!common.length) return;
    const timeOk = (T(me.start)===null || T(o.start)===null) ? true : overlap(me.start,me.end,o.start,o.end);
    if(timeOk) bad.push({scheme:o, values:common});
  });
  return bad;
}
// 演示用的内容指纹（真实实现是 canonical 序列化 + SHA-256）
function contentHash(s){
  const src = [s.calc,s.display,s.start,s.end,s.factors.map(f=>f.join('=')).join('|'),
               bindings.filter(b=>b.schemeId===s.id).map(b=>b.dimCode+b.match+b.values.join()).join('|')].join('#');
  let h = 5381; for(let i=0;i<src.length;i++) h = ((h*33) ^ src.charCodeAt(i)) >>> 0;
  return 'sha256:demo-' + h.toString(16).padStart(8,'0') + src.length.toString(16).padStart(3,'0');
}
</script>

const EDIT_MODULES = [

function timeRowsHtml(rows){ return rows.map(r=>`<div class="content-row time-row"><input type="time" class="time-start" value="${esc(r[0])}"><span>至</span><input type="time" class="time-end" value="${esc(r[1])}"><span>增加</span><input type="number" min="0" step="0.1" class="time-fee" value="${esc(r[2])}"><span>元</span></div>`).join(''); }
function distanceRowsHtml(rows){ return rows.map(r=>`<div class="content-row distance-row"><input type="number" min="0" class="distance-start" value="${esc(r[0])}"><span>米 -</span><input type="number" min="0" class="distance-end" value="${esc(r[1])}" placeholder="无穷大"><span>米，每增加</span><input type="number" min="1" class="distance-step" value="${esc(r[2])}"><span>米增加</span><input type="number" min="0" step="0.1" class="distance-fee" value="${esc(r[3])}"><span>元</span></div>`).join(''); }
function openSchemeEditForm(s){

function renderContentInputs(preset){
  const calc=$('#edit_module').value, factors=preset || [];
  if(calc==='C_FIXED_VALUE v1'){
    const raw=(factors.find(f=>f[0]==='BASE_FEE')||['',''])[1].match(/[\d.]+/); const value=raw?raw[0]:'';
    $('#content_inputs').innerHTML=`<div class="content-row"><span>BASE_FEE =</span><input type="number" min="0" step="0.1" id="fixed_fee" value="${value}"><span>元</span></div>`; return;
  }
  if(calc==='C_DISTANCE_STEP v1'){
    const rows=factors.map(f=>{ const range=f[0].match(/(\d+)-(\d+|无穷大)/), rule=f[1].match(/每增加(\d+)米增加([\d.]+)元/); return range&&rule?[range[1],range[2]==='无穷大'?'':range[2],rule[1],rule[2]]:null; }).filter(Boolean);
    $('#content_inputs').innerHTML=`<div id="list_rows">${distanceRowsHtml(rows.length?rows:[[0,500,100,0.5]])}</div><button class="btn" type="button" onclick="addContentRow('distance')">＋ 增加一行</button>`; return;
  }
  const timeFactors=calc==='C_BASE_TIME v1'?factors.filter(f=>f[0]!=='BASE_FEE'):factors;
  const rows=timeFactors.map(f=>{ const range=f[0].match(/(\d{2}:\d{2})-(\d{2}:\d{2})/), fee=f[1].match(/[\d.]+/); return range&&fee?[range[1],range[2],fee[0]]:null; }).filter(Boolean);
  const base=calc==='C_BASE_TIME v1'?((factors.find(f=>f[0]==='BASE_FEE')||['',''])[1].match(/[\d.]+/)||[''])[0]:'';
  $('#content_inputs').innerHTML=`${calc==='C_BASE_TIME v1'?`<div class="content-row"><span>BASE_FEE =</span><input type="number" min="0" step="0.1" id="base_fee" value="${base}"><span>元</span></div><div class="sec">时间配送费</div>`:''}<div id="list_rows">${timeRowsHtml(rows.length?rows:[['11:00','13:00','1.5']])}</div><button class="btn" type="button" onclick="addContentRow('time')">＋ 增加一行</button>`;
}
function addContentRow(type){ $('#list_rows').insertAdjacentHTML('beforeend',type==='distance'?distanceRowsHtml([['','','','']]):timeRowsHtml([['','','']])); }
function readContentFactors(calc){
  if(calc==='C_FIXED_VALUE v1') return [['BASE_FEE',$('#fixed_fee').value+' 元']];
  if(calc==='C_DISTANCE_STEP v1') return [...document.querySelectorAll('.distance-row')].map(r=>{const q=c=>r.querySelector(c).value.trim(); return [`${q('.distance-start')}-${q('.distance-end')||'无穷大'}米`,`每增加${q('.distance-step')}米增加${q('.distance-fee')}元`];});
  const time=[...document.querySelectorAll('.time-row')].map(r=>{const q=c=>r.querySelector(c).value.trim(); return [`${q('.time-start')}-${q('.time-end')}`,`增加${q('.time-fee')}元`];});
  return calc==='C_BASE_TIME v1'?[['BASE_FEE',$('#base_fee').value+' 元'],...time]:time;
}
function saveSchemeEdit(id){
  const s=schemeOf(id), name=$('#edit_name').value.trim(), calc=$('#edit_module').value, factors=readContentFactors(calc);
  const invalid=factors.some(f=>f.some(v=>!v||v==='—元'));
  if(!name || invalid){ formErr([!name?'方案名称必填':'请完整填写每一行具体方案']); return; }
  const modules=calc==='C_BASE_TIME v1'?[{name:'基础配送费',items:factors.filter(f=>f[0]==='BASE_FEE')},{name:'时间配送费',items:factors.filter(f=>f[0]!=='BASE_FEE')}]:null;

function saveSchemeCreate(){
  const name=$('#edit_name').value.trim(), calc=$('#edit_module').value, factors=readContentFactors(calc);
  const invalid=factors.some(f=>f.some(v=>!v||v==='—元'));
  if(!name || invalid){ formErr([!name?'方案名称必填':'请完整填写每一行具体方案']); return; }
  const scene=state.scene || (SCENES.find(x=>x.biz===state.tenant)||{}).code;

  if(!scene||!group||!fee){ formErr(['当前业务线没有可用的场景、费用组或费用项']); return; }
  const modules=calc==='C_BASE_TIME v1'?[{name:'基础配送费',items:factors.filter(f=>f[0]==='BASE_FEE')},{name:'时间配送费',items:factors.filter(f=>f[0]!=='BASE_FEE')}]:null;

  logAudit('新增方案',id+' '+name,'成功'); closeOverlay(); toast('已创建方案 '+id,'ok'); renderAll();

function cascadeGroups(presetGroup, presetFee){
  const scene=$('#f_scene').value;
  const gs = GROUPS.filter(g=>g.scene===scene);
  $('#f_group').innerHTML = '<option value="">请选择</option>'+gs.map(g=>`<option value="${g.code}" ${g.code===presetGroup?'selected':''}>${g.name}</option>`).join('');
  cascadeFees(presetFee);
}
function cascadeFees(presetFee){
  const g=$('#f_group').value;
  const fs = FEES.filter(f=>f.group===g);
  $('#f_fee').innerHTML = '<option value="">请选择</option>'+fs.map(f=>`<option value="${f.code}" ${f.code===presetFee?'selected':''}>${f.name}${f.required?'（组内必填）':''}</option>`).join('');

function formErr(list){
  $('#formErr').innerHTML = `<div class="err-box"><b>保存被拦截（${list.length} 项）</b><br>`+list.map(e=>'· '+e).join('<br>')+'</div>';
  $('#formErr').scrollIntoView({block:'nearest'});
}
function saveScheme(id){
  const g=k=>$('#f_'+k).value.trim();
  const name=g('name'), scene=g('scene'), group=g('group'), fee=g('fee');
  const old = id ? schemeOf(id) : null;
  const autoInterval=!!(old && old.status==='PUBLISHED');
  const start=autoInterval ? old.start : g('start').replace('T',' ');
  const end=autoInterval ? old.end : (g('end').replace('T',' ') || '—');
  const calc=g('calc'), display=g('display');
  const factors = g('factors').split('\n').map(l=>l.trim()).filter(Boolean)
                  .map(l=>{const i=l.indexOf('='); return i<0?[l,'—']:[l.slice(0,i).trim(), l.slice(i+1).trim()];});
  const modules = calc==='C_BASE_TIME v1' ? [
    {name:'基础配送费',items:factors.filter(f=>f[0]==='BASE_FEE')},
    {name:'时间配送费',items:factors.filter(f=>f[0]!=='BASE_FEE')},
  ] : null;
  const errs=[];
  if(!name) errs.push('方案名称必填');
  if(!scene||!group||!fee) errs.push('场景／费用组／费用必须逐级选到费用项（发布单元是费用组）');
  if(!id && !start) errs.push('生效开始时间必填——定时生效由时间区间自身切换，不依赖 job');
  if(!calc||!display) errs.push('<b>【双模板成对】</b>计算模板与展示模板必须同时选定，缺一不发：展示写的与算的必须一致');
  if(!factors.length) errs.push('至少一条因子赋值（缺因子下游算不出来）');
  if(start && end!=='—' && T(end)<=T(start)) errs.push('结束时间必须晚于开始时间（区间为左闭右开）');
  if(errs.length){ formErr(errs); return; }

  if(id){
    const s=schemeOf(id); Object.assign(s,{name,scene,group,fee,start,end,calc,display,factors,modules});
    logAudit('编辑方案', s.id+' '+name, '成功（后端自动维护生效区间）'); toast('已保存方案 '+s.id,'ok');
  }else{
    const nid=nextId('S');
    schemes.push({id:nid, name, biz:state.tenant, scene, group, fee, status:'DRAFT', start, end, calc, display, factors, modules, editor:'学员', approve:'—'});
    logAudit('新增方案草稿', nid+' '+name, '成功');
    toast('已创建草稿 '+nid+'（DRAFT，需提审后由发布事务转正）','ok',3400);
  }
  closeOverlay(); renderAll();
}
function delScheme(id){
  const s=schemeOf(id);
  if(bindings.some(b=>b.schemeId===id)){ toast('方案已有绑定关系，请先解除绑定后再删除','warn'); return; }
  confirmBox('确定删除方案 '+id+'「'+esc(s.name)+'」？','无绑定关系的方案可删除。',()=>{
    schemes = schemes.filter(x=>x.id!==id);
    logAudit('删除方案', id+' '+s.name, '成功'); toast('已删除方案 '+id,'ok'); renderAll();
  });
}

/* ------------------------------ 9. 绑定表单（新增 / 编辑 + I4 预检） ------------------------------ */
function openBindingForm(id){
  const b = id ? bindings.find(x=>x.id===id) : null;
  bindEditId = id||'';
  const list = s_schemes();   // 仅列当前业务线（与顶部场景下拉）下的方案
  overlay(`<div class="modal">
    <div class="modal-hd"><h3>${b?'编辑绑定关系':'新增绑定关系'} ${b?b.id:''}</h3><button class="x" onclick="closeOverlay()">×</button></div>
    <div class="modal-bd">
      <div id="formErr"></div>
      <div class="form-grid">
        <div class="field full"><label>方案 <em>*</em></label><select id="b_scheme" onchange="renderDimPick()">
          <option value="">请选择（仅本业务线下方案）</option>
          ${list.map(s=>`<option value="${s.id}" ${b&&b.schemeId===s.id?'selected':''}>${s.id} · ${esc(s.name)} · ${feeOf(s.fee).name} · ${s.status==='DRAFT'?'草稿':'已发布'}</option>`).join('')}</select></div>
        <div class="field"><label>维度 <em>*</em></label><select id="b_dim" onchange="renderDimPick()">
          <option value="">请选择</option>${DIM_CODES.map(d=>`<option value="${d.code}" ${b&&b.dimCode===d.code?'selected':''}>${d.name}</option>`).join('')}</select></div>
        <div class="field"><label>匹配模式 <em>*</em></label><select id="b_match" onchange="renderDimPick()">
          <option value="IN" ${!b||b.match==='IN'?'selected':''}>IN 包含（只对选中值生效）</option>
          <option value="NOT_IN" ${b&&b.match==='NOT_IN'?'selected':''}>NOT_IN 排除（除选中值外均生效）</option></select>
          <div class="hint">“默认 + 专属”范式：默认方案用 NOT_IN 补集表达</div></div>
        <div class="field full"><label>维度值 <em>*</em></label><div id="b_values" class="chips"></div>
          <div class="hint" id="b_candTip">先选维度，再勾选值</div></div>
      </div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeOverlay()">取消</button>
      <button class="btn btn-p" onclick="saveBinding('${id||''}')">${b?'保存':'创建绑定'}</button></div>
  </div>`);

function renderDimPick(preset){
  if(!$('#b_values')) return;
  const dim=$('#b_dim').value, match=$('#b_match').value;
  const checked = preset || (bindings.find(x=>x.id===bindEditId)||{}).values || [];
  const cand = (dimOf(dim).candidates||[]);
  $('#b_values').innerHTML = cand.length ? cand.map(v=>
    `<label class="chip" style="cursor:pointer;padding:4px 10px"><input type="checkbox" value="${esc(v)}" ${checked.includes(v)?'checked':''}> ${esc(v)}</label>`).join('')
    : '<span class="hint">请先选择维度</span>';
  $('#b_candTip').innerHTML = '候选集来自维度字典（'+(cand.length||0)+' 个值）。'
    + (match==='NOT_IN' ? '<b>NOT_IN</b> = 对候选全集取补集，勾得越多、覆盖越少。' : '未声明该维度 = 对候选全集生效。');
}
function saveBinding(id){
  const schemeId=$('#b_scheme').value, dimCode=$('#b_dim').value, match=$('#b_match').value;
  const values=[...$('#b_values').querySelectorAll('input:checked')].map(i=>i.value);
  const sc = schemeOf(schemeId);
  const errs=[];
  if(!schemeId) errs.push('请选择方案');
  if(!dimCode) errs.push('请选择维度');
  if(!values.length) errs.push('至少勾选一个维度值');
  if(match==='NOT_IN' && values.length===(dimOf(dimCode).candidates||[]).length)
    errs.push('<b>NOT_IN 排除了全部候选值</b> = 这一版永不生效，请核实（属配置语义错误，不是冲突）');
  if(schemeId && dimCode){
    const dup = bindings.find(x=>x.schemeId===schemeId && x.dimCode===dimCode && x.id!==id);
    if(dup) errs.push('该方案在【'+dimOf(dimCode).name+'】维度已有绑定行 '+dup.id+'：同一方案同一维度只保留一行，要增减值请去改那一行（否则语义二义）');
  }
  if(!errs.length){
    const extra = {id:id||'__new__', schemeId, dimCode, match, values, start:sc.start, end:sc.end};
    const bad = checkI4(schemeId, dimCode, id||null, extra);
    if(bad.length){
      errs.push('<b>【不变式 I4 · 维度互斥】</b>与同费用「'+feeOf(sc.fee).name+'」下的已发布实例命中集合相交：');
      bad.forEach(x=>errs.push('　与 '+x.scheme.id+'「'+esc(x.scheme.name)+'」共有 <b>'+x.values.join('、')+'</b>（'+dimOf(dimCode).name+'），'+

  if(sc.status==='PUBLISHED') toast('提示：该绑定挂在已发布版本上，真实系统不允许直接改——需新建版本发布（此处演示放开）','warn',3600);

  if(id){
    const b=bindings.find(x=>x.id===id); Object.assign(b,{schemeId,dimCode,match,values,start:sc.start||'—',end:sc.end||'—'});
    logAudit('编辑绑定', id+' → '+sc.id+' ／ '+dimOf(dimCode).name+' '+match+' ['+values.join('、')+']', '成功（冲突预检通过）');

  bindEditId=''; closeOverlay(); renderAll();

function timeSurcharge(value){
  const m=String(value).trim().match(/^(\d{1,2}):(\d{2})$/); if(!m) return null;
  const mins=Number(m[1])*60+Number(m[2]);
  if(mins>=660 && mins<780) return 1.5;
  if(mins>=1060 && mins<1110) return 2;
  return 0;
}
function distanceSurcharge(meters){
  const d=Number(meters); if(!Number.isFinite(d)||d<0) return null;
  if(d<=500) return Math.ceil(d/100)*0.5;
  if(d<=2500) return 2.5+Math.ceil((d-500)/300)*1;
  if(d<=3500) return 9.5+Math.ceil((d-2500)/500)*1.5;
  return 12.5+Math.ceil((d-3500)/1000)*2.5;
}
function calculateScheme(s,value){
  if(s.calc==='C_FIXED_VALUE v1') return {input:value,result:5,unit:'元'};
  if(s.calc==='C_DISTANCE_STEP v1'){
    const result=distanceSurcharge(value); return result===null?{input:value,error:'请输入大于等于 0 的距离（米）'}:{input:value,result,unit:'元'};
  }
  if(s.calc==='C_TIME_SURCHARGE v1' || s.calc==='C_BASE_TIME v1'){
    const fee=timeSurcharge(value); if(fee===null) return {input:value,error:'请输入 HH:mm 格式的时间'};
    return {input:value,result:(s.calc==='C_BASE_TIME v1'?5:0)+fee,unit:'元'};
  }
  return {input:value,error:'该模板暂未配置测算规则'};
}
function openCalculator(id){
  const s=schemeOf(id);
  const isDistance=s.calc==='C_DISTANCE_STEP v1', isTime=['C_TIME_SURCHARGE v1','C_BASE_TIME v1'].includes(s.calc);
  const hint=isDistance?'每行输入一个距离（单位：米），可一次输入多个距离。':isTime?'每行输入一个时间（HH:mm），可一次输入多个时间。':'固定值模板无需输入；每行会返回相同结果。';
  overlay(`<div class="modal" style="width:620px">
    <div class="modal-hd"><h3>方案测算 · ${s.id} ${esc(s.name)}</h3><button class="x" onclick="closeOverlay()">×</button></div>
    <div class="modal-bd"><div class="sec">关联模板</div><div class="mono">${esc(templateName(s.calc))}</div>
      <div class="field" style="margin-top:16px"><label>输入值（每行一个）</label><textarea id="calc_values" placeholder="${isDistance?'100\n800\n2800':isTime?'11:30\n18:00':'任意值'}"></textarea><div class="hint">${hint}</div></div>
      <div id="calc_result" style="margin-top:16px"></div>
    </div>
    <div class="modal-ft"><button class="btn" onclick="closeOverlay()">取消</button><button class="btn btn-p" onclick="runCalculator('${s.id}')">计算</button></div>
  </div>`);
}
function runCalculator(id){
  const s=schemeOf(id); const values=$('#calc_values').value.split('\n').map(x=>x.trim()).filter(Boolean);
  const inputs=values.length?values:['—']; const results=inputs.map(v=>calculateScheme(s,v));
  $('#calc_result').innerHTML=`<div class="sec">测算结果</div><table><thead><tr><th>输入值</th><th>结果</th></tr></thead><tbody>${results.map(r=>`<tr><td>${esc(r.input)}</td><td>${r.error?`<span style="color:var(--err)">${esc(r.error)}</span>`:`<b>${r.result} ${r.unit}</b>`}</td></tr>`).join('')}</tbody></table>`;
}

    <div class="note"><b>为什么它属于“核心逻辑”而非附属功能：</b>定价是跟钱相关的经营数据，“当时到底发的是什么价”必须能自证。
    审计 + 版本行回放，取代了向下游上报核查那套重机制。</div>`;
}
function renderAbout(){
  const path=[['切业务线（租户）','顶部三条业务线就是租户口径：用户配送费（C端）、骑手配送费（向骑手结算）、商家配送费（向商家收取）——同一平台伺候三方、数据彼此隔离。先点两下看下方列表怎么变'],
    ['用场景下拉收敛列表','业务线下方、页签上方的「定价场景」下拉：每条业务线下都是快送／专送／混合送三个场景。选一个，两个页签的列表与角标同时收敛（它就是列表的第一层过滤器）'],
    ['方案页签看版本链','用户配送费·快送下，S101 → S102 → S103 是同一条链 R-A：改价不是 update 一行，而是“一行一个时间段”。点 S102 的「查看」看右侧时间轴'],
    ['新增方案 · 演 I1','方案页签点新增（场景已默认带出快送）→ 快送费用组／快送配送费 → 版本链选 R-A → 生效区间填 2026-10-15 ~ 2026-12-31（与 S102 重叠）→ 保存被拦'],
    ['新增方案 · 演双模板','再走到表单，只选计算模板、不选展示模板 → 保存被拦（展示与计算不一致是定价重大事故）'],
    ['绑定页签 · 演预检通过','新增绑定 → 方案 S104、维度「城市」、IN、勾「上海」→ 通过（该费用下没有别的已发布实例）'],
    ['绑定页签 · 演 I4 拦截','（先把场景下拉切回快送）编辑绑定 D007（S110 上海快送恶劣天气附加）→ 维度值再加勾「杭州」→ 保存：与 S105 的 NOT_IN[上海]（= 除上海外全集）在「杭州」相交 → 拦截并列出共有值'],
    ['看 NOT_IN 补集','对比 D007 与 D004：S110 管上海、S105 管除上海以外——IN 与 NOT_IN 互补共存，这就是“默认 + 专属”范式（骑手配送费下的 D201/D202 是同一模式的第二份数据）'],
    ['演不可删','删一条 PUBLISHED 方案 → 被拒，弹窗解释“发布后内容不可变、回放即审计”'],
    ['扫其他导航','因子中心／模板中心／审批与发布／分发接口／审计日志——各停留 20 秒，告诉学生哪一周会亲手写它']];
  return `<div class="page-intro"><h2>演示说明（带教路径）</h2>
    <p>纯前端假数据，第 1 课现场把“配置平台的逻辑”走一遍——<b>不讲代码，只走业务闭环</b>，约 8 分钟。</p></div>
    <div class="card"><div class="card-bd"><div class="chain">
      ${path.map((x,i)=>`<div class="chain-i ${i<2?'now':''}"><b>${i+1}. ${x[0]}</b><div><small>${x[1]}</small></div></div>`).join('')}
    </div></div></div>
    <div class="note"><b>收口一句话：</b>页面上每一次“保存被拦截”都不是 bug，而是设计文档里那条不变式在界面上活了一次——
    I1（一个实例任一时点至多一个版本）、I4（同费用实例维度互斥）、双模板成对、已发布不可变。</div>
    <div class="card"><div class="card-hd"><h3>本演示不演什么</h3></div><div class="card-bd"><p style="margin:0;color:var(--ink2);font-size:13px">
      审批流的真实状态机、发布事务的锁与顺序、content_hash 的 canonical 算法、因子校验的完整规则、登录与权限、批量导入与线程池——
      这些都在 docs/ 设计文档里，按大纲第 2~5 周逐个亲手实现。</p></div></div>`;
}

/* ------------------------------ 12. 弹层通用 + 启动 ------------------------------ */
function openImport(type){
  const name=type==='scheme'?'方案':'维度绑定';
  overlay(`<div class="modal" style="width:600px"><div class="modal-hd"><h3>导入${name}</h3><button class="x" onclick="closeOverlay()">×</button></div>
    <div class="modal-bd"><div class="page-intro" style="margin:0"><h2>导入文件</h2><p>请先下载模板并按要求填写，再上传 Excel 文件。查看导入数据会跳转到导入任务页面。</p></div>
      <div style="margin-top:16px"><a class="btn" href="pricing-import-template.xlsx" download>下载模板</a></div>
      <div class="field" style="margin-top:16px"><label>上传 Excel 文件 <em>*</em></label><input type="file" id="import_file" accept=".xlsx,.xls"></div></div>
    <div class="modal-ft"><button class="btn" onclick="closeOverlay()">取消</button><button class="btn btn-p" onclick="showImportData('${type}')">查看导入数据 →</button></div></div>`);
}
function showImportData(type){
  const file=$('#import_file').files[0]; if(!file){ toast('请先选择 Excel 文件','warn'); return; }
  const isScheme=type==='scheme', rows=isScheme?
    [['1001','基础配送费','固定值','BASE_FEE = 5 元','张三'],['1002','距离加价配送费','距离步长','0-500米 每增加100米增加0.5元','张三']]:
    [['201','城市','上海','1001','2026-10-01 00:00','张三'],['301','配送区域','G-001','1002','2026-10-01 00:00','李四']];
  const headers=isScheme?['方案 ID','方案名称','模块','具体方案','创建人']:['维度 ID','维度类型','维度名称','方案 ID','开始时间','创建人'];
  const task={id:++state.seq,fileName:file.name,type,rows,headers,status:'待确认',createdAt:fmtNow()}; importTasks.unshift(task);
  closeOverlay(); state.importTaskId=task.id; state.page='importData'; renderAll();
}
function overlay(html, isDrawer){
  $('#overlay').innerHTML = `<div class="mask" style="${isDrawer?'justify-content:flex-end;align-items:stretch':''}"
    onclick="if(event.target===this)closeOverlay()">${html}</div>`;
}
function closeOverlay(){ const o=$('#overlay'); if(o) o.innerHTML=''; bindEditId=''; }
function confirmBox(title, sub, onOk){
  window.__confirm = onOk;
  overlay(`<div class="modal" style="width:500px">
    <div class="modal-hd"><h3>请确认</h3><button class="x" onclick="closeOverlay()">×</button></div>
    <div class="modal-bd"><div style="font-size:14px;font-weight:600;margin-bottom:6px">${title}</div>
      <div style="font-size:12.5px;color:var(--ink2)">${sub}</div></div>
    <div class="modal-ft"><button class="btn" onclick="closeOverlay()">取消</button>
      <button class="btn btn-p" onclick="okConfirm()">确认</button></div></div>`);
}
function okConfirm(){ const f=window.__confirm; closeOverlay(); window.__confirm=null; if(f) f(); }

renderAll();
</script>
